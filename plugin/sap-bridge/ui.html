<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAP Bridge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:auto}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:11px;
  color:var(--figma-color-text);
  background:var(--figma-color-bg);
  display:flex;
  flex-direction:column;
}

/* ── header ── */
.header{
  display:flex;align-items:center;gap:6px;
  padding:8px 10px 6px;
  border-bottom:1px solid var(--figma-color-border);
  flex-shrink:0;
}
.header-title{font-size:12px;font-weight:600;flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:#888;flex-shrink:0}
.dot.looking{background:#888;animation:pulse 1.4s ease-in-out infinite}
.dot.connected{background:#1bc47d}
.dot.pair-locked,.dot.wrong-bridge{background:#f6a623}
.dot.error-state{background:#f24822}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.status-text{color:var(--figma-color-text-secondary);font-size:10px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── body: grows with content, the Figma window resizes to fit (see 'resize' postMessage) ── */
.body{display:flex;flex-direction:column;gap:6px;padding:8px 10px}

/* ── chips ── */
.chips{display:flex;flex-wrap:wrap;gap:4px;min-height:0}
.chip{
  display:flex;align-items:center;gap:3px;
  padding:2px 6px;border-radius:4px;
  background:var(--figma-color-bg-secondary);
  color:var(--figma-color-text);
  font-size:10px;border:1px solid var(--figma-color-border);
}
.chip.img{border-color:var(--figma-color-bg-brand)}

/* ── textarea + drop zone ── */
.input-wrap{position:relative}
textarea{
  width:100%;resize:none;
  padding:6px 8px;
  border:1px solid var(--figma-color-border);
  border-radius:6px;
  background:var(--figma-color-bg);
  color:var(--figma-color-text);
  font-size:11px;font-family:inherit;
  line-height:1.4;
  outline:none;
  min-height:60px;
}
textarea:focus{border-color:var(--figma-color-bg-brand)}
textarea::placeholder{color:var(--figma-color-text-tertiary)}

.drop-zone{
  border:1px dashed var(--figma-color-border);
  border-radius:6px;padding:8px;
  text-align:center;
  color:var(--figma-color-text-secondary);
  font-size:10px;cursor:pointer;
  transition:background .15s,border-color .15s;
  position:relative;
}
.drop-zone.over,.drop-zone:hover{
  background:var(--figma-color-bg-secondary);
  border-color:var(--figma-color-bg-brand);
}
.drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.img-thumb{
  display:flex;align-items:center;gap:6px;
  padding:4px 6px;
  background:var(--figma-color-bg-secondary);
  border-radius:4px;border:1px solid var(--figma-color-border);
  font-size:10px;
}
.img-thumb img{width:32px;height:32px;object-fit:cover;border-radius:3px}
.img-clear{margin-left:auto;cursor:pointer;color:var(--figma-color-text-secondary);background:none;border:none;font-size:12px;line-height:1;padding:0 2px}

/* ── mode toggle ── */
.mode-row{display:flex;gap:4px}
.mode-btn{
  flex:1;padding:4px 6px;
  border:1px solid var(--figma-color-border);
  border-radius:4px;cursor:pointer;
  background:var(--figma-color-bg);
  color:var(--figma-color-text);
  font-size:10px;font-family:inherit;
  transition:background .1s,border-color .1s;
}
.mode-btn.active{
  background:var(--figma-color-bg-brand);
  color:#fff;border-color:var(--figma-color-bg-brand);
}

/* ── go / cancel ── */
.go-btn{
  width:100%;padding:7px;
  border:none;border-radius:6px;cursor:pointer;
  font-size:12px;font-weight:600;font-family:inherit;
  background:var(--figma-color-bg-brand);
  color:#fff;
  transition:opacity .15s;
}
.go-btn:disabled{opacity:.4;cursor:not-allowed}
.go-btn.cancel{background:#f24822}

/* ── stage list ── */
.stages{display:flex;flex-direction:column;gap:2px}
.stage-row{display:flex;align-items:center;gap:6px;padding:3px 0}
.stage-icon{width:14px;height:14px;flex-shrink:0;border-radius:50%;border:1px solid var(--figma-color-border);position:relative}
.stage-icon.done{background:var(--figma-color-bg-brand);border-color:var(--figma-color-bg-brand)}
.stage-icon.done::after{content:'';position:absolute;left:3px;top:2px;width:5px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg)}
.stage-icon.active{border-color:var(--figma-color-bg-brand);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stage-icon.error{background:#f24822;border-color:#f24822}
.stage-name{font-size:10px;font-weight:500;flex:1}
.stage-name.active{color:var(--figma-color-bg-brand)}
.stage-name.done{color:var(--figma-color-text-secondary)}
.progress-text{font-size:9px;color:var(--figma-color-text-secondary);padding-left:20px;word-break:break-all}

/* ── cards ── */
.card{
  border:1px solid var(--figma-color-border);
  border-radius:6px;padding:8px 10px;
  display:flex;flex-direction:column;gap:6px;
}
.card.ask{border-color:#f6a623}
.card.mailbox{border-color:var(--figma-color-bg-brand)}
.card.result.pass{border-color:#1bc47d}
.card.result.fail{border-color:#f24822}
.card.error-card{border-color:#f24822;background:rgba(242,72,34,.08)}
.card-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--figma-color-text-secondary)}

.ask-question{font-size:11px;line-height:1.4}
.ask-input{
  width:100%;padding:5px 7px;
  border:1px solid var(--figma-color-border);
  border-radius:4px;
  background:var(--figma-color-bg);
  color:var(--figma-color-text);
  font-size:11px;font-family:inherit;outline:none;
}
.ask-input:focus{border-color:var(--figma-color-bg-brand)}
.ask-btn{
  align-self:flex-end;
  padding:4px 10px;border:none;border-radius:4px;
  background:var(--figma-color-bg-brand);
  color:#fff;font-size:11px;font-family:inherit;cursor:pointer;
}

.mbx-hint{font-size:11px;line-height:1.4}
.mbx-hint strong{color:var(--figma-color-text)}

.score-row{display:flex;gap:8px}
.score{font-size:18px;font-weight:700}
.score.pass{color:#1bc47d}
.score.fail{color:#f24822}
.score-label{font-size:9px;color:var(--figma-color-text-secondary);margin-top:2px}
.blocks{font-size:10px;color:#f24822;margin-top:2px}
.res-name{font-size:13px;font-weight:700;color:var(--figma-color-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-sub{font-size:10px;color:var(--figma-color-text-secondary);line-height:1.35}
.hist-item{display:flex;flex-direction:column;gap:2px;padding:6px 8px;border-radius:5px;border:1px solid var(--figma-color-border);border-left:3px solid #1bc47d;cursor:pointer}
.hist-item.fail{border-left-color:#f24822}
.hist-item:hover{background:var(--figma-color-bg-hover)}
.hist-top{display:flex;gap:6px;align-items:baseline}
.hist-name{flex:1;font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-score{font-size:11px;font-weight:700;color:#1bc47d}
.hist-item.fail .hist-score{color:#f24822}
.log-btn{border:0;background:none;padding:2px;cursor:pointer;color:var(--figma-color-text-secondary);display:inline-flex;border-radius:4px}
.log-btn:hover{background:var(--figma-color-bg-hover);color:var(--figma-color-text)}
.log-tip{position:fixed;z-index:50;max-width:330px;max-height:260px;overflow:hidden;padding:8px 10px;border-radius:6px;background:#1e1e1e;color:#fff;font:10px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;box-shadow:0 4px 14px rgba(0,0,0,.35);pointer-events:none;display:none}
.hist-list{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto}
.show-btn{
  align-self:flex-start;
  padding:4px 10px;border:none;border-radius:4px;
  background:var(--figma-color-bg-secondary);
  color:var(--figma-color-text);
  font-size:10px;font-family:inherit;cursor:pointer;
  border:1px solid var(--figma-color-border);
}

.error-msg{font-size:11px;color:#f24822;word-break:break-all}

/* ── footer ── */
.footer{
  padding:4px 10px 6px;
  border-top:1px solid var(--figma-color-border);
  flex-shrink:0;
  display:flex;justify-content:flex-end;
}
.footer-btn{
  background:none;border:none;
  font-size:9px;color:var(--figma-color-text-tertiary);
  cursor:pointer;padding:0;
}
.footer-btn:hover{color:var(--figma-color-text)}
</style>
</head>
<body>

<!-- header -->
<div class="header">
  <span class="header-title">SAP Bridge</span>
  <span class="status-text" id="statusText">Looking for bridge…</span>
  <span class="dot looking" id="statusDot"></span>
</div>

<!-- scrollable body -->
<div class="body" id="bodyEl">

  <!-- selection chips -->
  <div class="chips" id="chips" style="display:none"></div>

  <!-- textarea -->
  <div class="input-wrap">
    <textarea id="prompt" rows="3" placeholder="What do you want?"></textarea>
  </div>

  <!-- image drop zone -->
  <div id="dropZone" class="drop-zone">
    Drop a reference image here, or click to browse
    <input type="file" id="fileInput" accept="image/*">
  </div>
  <div id="imgThumb" class="img-thumb" style="display:none">
    <img id="imgPreview" src="" alt="ref">
    <span id="imgName" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
    <button class="img-clear" id="imgClear">×</button>
  </div>

  <!-- go button -->
  <button class="go-btn" id="goBtn" disabled>Go</button>

  <!-- stages (hidden until job starts) -->
  <div class="stages" id="stages" style="display:none" aria-live="polite"></div>
  <div class="progress-text" id="progressText" style="display:none"></div>
  <div class="progress-text" id="timerText" style="display:none"></div>

  <!-- ask card -->
  <div class="card ask" id="askCard" style="display:none">
    <div class="card-label">Question</div>
    <div class="ask-question" id="askQuestion"></div>
    <input class="ask-input" id="askInput" type="text" placeholder="Your answer…">
    <button class="ask-btn" id="askBtn">Answer</button>
  </div>

  <!-- mailbox card -->
  <div class="card mailbox" id="mbxCard" style="display:none">
    <div class="card-label">Figma Agent</div>
    <div class="mbx-hint" id="mbxHint"></div>
  </div>

  <!-- result card -->
  <div class="card result" id="resultCard" style="display:none">
    <div class="card-label">Result</div>
    <div class="res-name" id="resName"></div>
    <div class="res-sub" id="resSub"></div>
    <div class="score-row">
      <div>
        <div class="score" id="matchScore">—</div>
        <div class="score-label">MATCH %</div>
      </div>
      <div>
        <div class="score" id="eyeScore">—</div>
        <div class="score-label">EYE %</div>
      </div>
    </div>
    <div class="blocks" id="blocksList" style="display:none"></div>
    <button class="show-btn" id="showBtn">Show in canvas</button>
    <span id="resLog"></span>
  </div>

  <!-- history card: every result of this file, kept in the file -->
  <div class="card" id="histCard" style="display:none">
    <div class="card-label">History · this file</div>
    <div class="hist-list" id="histList"></div>
  </div>

  <!-- error card -->
  <div class="card error-card" id="errCard" style="display:none">
    <div class="card-label">Error</div>
    <div class="error-msg" id="errMsg"></div>
  </div>

</div>

<!-- footer -->
<div class="footer">
  <button class="footer-btn" id="unpairBtn" title="The plugin pairs and reconnects by itself">Pairing help</button>
</div>

<script>
(function() {
  'use strict';

  var STAGES = ['route','plan','analyse','execute','logos','check','fix','done'];
  var connected = false;
  var running   = false;
  var currentJobId = null;
  var doneNodeId   = null;
  var mode         = 'claude';
  var imageBase64  = null;
  var imageMime    = null;
  var jobElapsedMs = null;
  var timerHandle  = null;

  // ── timer ─────────────────────────────────────────────────────────────────
  // Counts only the time Claude is actually working. Paused while we wait on
  // the user (a question, or "type build plan in the Figma Agent") so those
  // minutes don't get counted as build time.
  var timerAccumMs  = 0;    // ms counted so far, across pauses
  var timerRunSince = null; // Date.now() of the current running stretch, or null if paused/stopped
  function fmtElapsed(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    var m = Math.floor(s / 60);
    s = s % 60;
    return m + 'm ' + (s < 10 ? '0' : '') + s + 's';
  }
  function currentElapsed() {
    return timerAccumMs + (timerRunSince ? Date.now() - timerRunSince : 0);
  }
  function startTimer() {
    timerAccumMs = 0;
    timerRunSince = Date.now();
    jobElapsedMs = null;
    el.timer.style.display = '';
    tickTimer();
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(tickTimer, 1000);
  }
  function tickTimer() {
    el.timer.textContent = (timerRunSince ? 'Running · ' : 'Waiting on you · ') + fmtElapsed(currentElapsed());
  }
  function pauseTimer() {
    if (!timerRunSince) return;
    timerAccumMs += Date.now() - timerRunSince;
    timerRunSince = null;
    tickTimer();
  }
  function resumeTimer() {
    if (timerRunSince || !timerHandle) return; // not paused, or job already ended
    timerRunSince = Date.now();
    tickTimer();
  }
  function stopTimer() {
    if (timerRunSince) timerAccumMs += Date.now() - timerRunSince;
    timerRunSince = null;
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
    jobElapsedMs = timerAccumMs;
  }

  // ── DOM refs ──────────────────────────────────────────────────────────────
  var el = {
    dot:        document.getElementById('statusDot'),
    statusText: document.getElementById('statusText'),
    chips:      document.getElementById('chips'),
    prompt:     document.getElementById('prompt'),
    dropZone:   document.getElementById('dropZone'),
    fileInput:  document.getElementById('fileInput'),
    imgThumb:   document.getElementById('imgThumb'),
    imgPreview: document.getElementById('imgPreview'),
    imgName:    document.getElementById('imgName'),
    imgClear:   document.getElementById('imgClear'),
    goBtn:      document.getElementById('goBtn'),
    stages:     document.getElementById('stages'),
    progress:   document.getElementById('progressText'),
    timer:      document.getElementById('timerText'),
    askCard:    document.getElementById('askCard'),
    askQ:       document.getElementById('askQuestion'),
    askInput:   document.getElementById('askInput'),
    askBtn:     document.getElementById('askBtn'),
    mbxCard:    document.getElementById('mbxCard'),
    mbxHint:    document.getElementById('mbxHint'),
    resultCard: document.getElementById('resultCard'),
    resName:    document.getElementById('resName'),
    resSub:     document.getElementById('resSub'),
    histCard:   document.getElementById('histCard'),
    histList:   document.getElementById('histList'),
    matchScore: document.getElementById('matchScore'),
    eyeScore:   document.getElementById('eyeScore'),
    blocksList: document.getElementById('blocksList'),
    showBtn:    document.getElementById('showBtn'),
    errCard:    document.getElementById('errCard'),
    errMsg:     document.getElementById('errMsg'),
    unpairBtn:  document.getElementById('unpairBtn'),
    body:       document.getElementById('bodyEl')
  };

  // ── status ────────────────────────────────────────────────────────────────
  function setStatus(value, info) {
    el.dot.className = 'dot ' + value;
    switch (value) {
      case 'looking':
        el.statusText.textContent = 'Looking for Claude…';
        connected = false; break;
      case 'connected':
        el.statusText.textContent = 'Connected to Claude · ' + (info && info.branch || 'v4') + (info && info.busy ? ' · busy' : '');
        connected = true; break;
      case 'wrong-bridge':
        el.statusText.textContent = 'Port 41778 is used by another program';
        connected = false; break;
      case 'pair-locked':
        el.statusText.textContent = 'Paired with another Figma — ask Claude: node build/mailbox.js unpair';
        connected = false; break;
      case 'paired':
        el.statusText.textContent = 'Paired ✓';
        connected = true; break;
      default:
        el.statusText.textContent = value;
    }
    updateGoBtn();
  }

  // ── go button ─────────────────────────────────────────────────────────────
  function updateGoBtn() {
    var hasContent = el.prompt.value.trim().length > 0 || imageBase64 !== null;
    if (running) {
      el.goBtn.disabled = false;
      el.goBtn.textContent = 'Cancel';
      el.goBtn.className = 'go-btn cancel';
    } else {
      el.goBtn.disabled = !connected || !hasContent;
      el.goBtn.textContent = 'Go';
      el.goBtn.className = 'go-btn';
    }
  }

  el.prompt.addEventListener('input', updateGoBtn);
  el.prompt.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!el.goBtn.disabled && !running) fireGo();
    }
  });

  // ── chips ─────────────────────────────────────────────────────────────────
  function renderChips(nodes) {
    if (!nodes || nodes.length === 0) { el.chips.style.display = 'none'; el.chips.innerHTML = ''; return; }
    el.chips.style.display = 'flex';
    el.chips.innerHTML = nodes.map(function(n) {
      return '<span class="chip' + (n.isImage ? ' img' : '') + '" title="' + escape(n.name) + '">' +
        (n.isImage ? '🖼 ' : '') + truncate(n.name, 18) + '</span>';
    }).join('');
  }
  function escape(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
  function truncate(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }

  // ── image drop / pick ─────────────────────────────────────────────────────
  el.dropZone.addEventListener('dragover', function(e) { e.preventDefault(); el.dropZone.classList.add('over'); });
  el.dropZone.addEventListener('dragleave', function() { el.dropZone.classList.remove('over'); });
  el.dropZone.addEventListener('drop', function(e) {
    e.preventDefault(); el.dropZone.classList.remove('over');
    var f = e.dataTransfer && e.dataTransfer.files[0];
    if (f && f.type.indexOf('image') === 0) readImageFile(f);
  });
  el.fileInput.addEventListener('change', function() {
    var f = el.fileInput.files[0];
    if (f) readImageFile(f);
    el.fileInput.value = '';
  });
  el.imgClear.addEventListener('click', function() {
    imageBase64 = null; imageMime = null;
    el.imgThumb.style.display = 'none';
    el.dropZone.style.display = '';
    updateGoBtn();
  });

  function readImageFile(file) {
    var reader = new FileReader();
    reader.onload = function(ev) {
      var dataUrl = ev.target.result;
      // strip "data:image/...;base64," prefix
      var idx = dataUrl.indexOf(',');
      imageBase64 = idx >= 0 ? dataUrl.slice(idx + 1) : dataUrl;
      imageMime   = file.type || 'image/png';
      el.imgPreview.src = dataUrl;
      el.imgName.textContent = file.name;
      el.dropZone.style.display = 'none';
      el.imgThumb.style.display = 'flex';
      updateGoBtn();
    };
    reader.readAsDataURL(file);
  }

  // ── stages ────────────────────────────────────────────────────────────────
  var stageState = {}; // name → 'pending'|'active'|'done'|'error'

  function initStages() {
    stageState = {};
    STAGES.forEach(function(n) { stageState[n] = 'pending'; });
    renderStages();
    el.stages.style.display = 'flex';
    el.progress.style.display = 'none';
  }

  function renderStages() {
    el.stages.innerHTML = STAGES.map(function(n) {
      var s = stageState[n] || 'pending';
      return '<div class="stage-row">' +
        '<div class="stage-icon ' + s + '"></div>' +
        '<span class="stage-name ' + s + '">' + n.charAt(0).toUpperCase() + n.slice(1) + '</span>' +
        '</div>';
    }).join('');
  }

  function setStage(name, state) {
    // mark preceding stages done if not already
    var idx = STAGES.indexOf(name);
    if (idx >= 0) {
      STAGES.slice(0, idx).forEach(function(n) {
        if (stageState[n] === 'pending' || stageState[n] === 'active') stageState[n] = 'done';
      });
      stageState[name] = state;
    }
    renderStages();
  }

  // ── ask ───────────────────────────────────────────────────────────────────
  var askJobId = null;
  el.askBtn.addEventListener('click', function() {
    var answer = el.askInput.value.trim();
    if (!answer) return;
    postMsg({ type: 'answer', jobId: askJobId, text: answer });
    el.askCard.style.display = 'none';
    el.askInput.value = '';
    resumeTimer();
  });
  el.askInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') el.askBtn.click();
  });

  // ── show in canvas ────────────────────────────────────────────────────────
  el.showBtn.addEventListener('click', function() {
    if (doneNodeId) postMsg({ type: 'show-node', nodeId: doneNodeId });
  });

  // ── unpair ────────────────────────────────────────────────────────────────
  el.unpairBtn.addEventListener('click', function() { postMsg({ type: 'unpair' }); });

  // ── go / cancel ───────────────────────────────────────────────────────────
  el.goBtn.addEventListener('click', function() {
    if (running) {
      postMsg({ type: 'cancel' });
      return;
    }
    fireGo();
  });

  function fireGo() {
    if (!connected) return;
    var text = el.prompt.value.trim();
    if (!text && !imageBase64) return;
    hideCards();
    initStages();
    startTimer();
    postMsg({
      type:        'go',
      text:        text,
      mode:        mode,
      imageBase64: imageBase64,
      imageMime:   imageMime,
      imageNodeId: null
    });
    running = true;
    updateGoBtn();
  }

  function hideCards() {
    el.askCard.style.display = 'none';
    el.mbxCard.style.display = 'none';
    el.resultCard.style.display = 'none';
    el.errCard.style.display = 'none';
  }

  // ── messages from code.js ─────────────────────────────────────────────────
  window.onmessage = function(ev) {
    var msg = ev.data && ev.data.pluginMessage;
    if (!msg) return;
    switch (msg.type) {
      case 'status':
        setStatus(msg.value, msg);
        break;
      case 'selection':
        renderChips(msg.nodes);
        break;
      case 'job-started':
        currentJobId = msg.jobId;
        break;
      case 'job-resumed':
        currentJobId = msg.jobId;
        running = true;
        initStages();
        updateGoBtn();
        break;
      case 'stage':
        resumeTimer(); // Claude is working again — a stage only fires while it runs
        setStage(msg.name, 'active');
        if (msg.text) { el.progress.style.display = ''; el.progress.textContent = msg.text; }
        break;
      case 'progress':
        el.progress.style.display = '';
        el.progress.textContent = msg.text;
        break;
      case 'tree-status':
        // v5 tree job (CLI build/send.js) — one live line so the user sees the plugin building.
        el.progress.style.display = '';
        el.progress.textContent = 'Tree job · ' + msg.text;
        break;
      case 'ask':
        pauseTimer(); // waiting on the user's answer — not build time
        askJobId = msg.jobId;
        el.askQ.textContent = msg.question;
        el.askCard.style.display = 'flex';
        el.askInput.focus();
        scroll();
        break;
      case 'mailbox':
        pauseTimer(); // waiting for the user to type in the Figma Agent — not build time
        el.mbxHint.innerHTML = msg.kind === 'plan'
          ? 'Now type <strong>build plan</strong> in the Figma Agent.'
          : 'Now type <strong>apply fixes</strong> in the Figma Agent.';
        el.mbxCard.style.display = 'flex';
        scroll();
        break;
      case 'logos-placed':
        setStage('logos', 'done');
        break;
      case 'done':
        el.mbxCard.style.display = 'none';
        running = false;
        updateGoBtn();
        stopTimer();
        el.timer.style.display = 'none';
        var d = msg.data;
        doneNodeId = d.nodeId || null;
        fillResultText(d);
        setStage('done', 'done');
        var pass = d.pass !== false;
        el.resultCard.className = 'card result ' + (pass ? 'pass' : 'fail');
        el.matchScore.textContent = d.match != null ? d.match + '%' : '—';
        el.matchScore.className   = 'score ' + (pass ? 'pass' : 'fail');
        el.eyeScore.textContent   = d.eye   != null ? d.eye   + '%' : '—';
        el.eyeScore.className     = 'score ' + (pass ? 'pass' : 'fail');
        if (d.blocks && d.blocks.length) {
          el.blocksList.style.display = '';
          el.blocksList.textContent = d.blocks.join(' · ');
        } else {
          el.blocksList.style.display = 'none';
        }
        el.resultCard.style.display = 'flex';
        var rl = document.getElementById('resLog'); if (rl) { rl.innerHTML = ''; var jb = logButton(msg.data && msg.data.jobId); jb.style.marginLeft = '8px'; rl.appendChild(jb); }
        scroll();
        break;
      case 'log-opened': {
        var lb = document.querySelector('.log-btn[data-job="' + msg.jobId + '"]');
        if (msg.ok && msg.text) { logFull[msg.jobId] = msg.text; logCache[msg.jobId] = logSummary(msg.text); if (hoverJob === msg.jobId) showTip(logCache[msg.jobId]); }
        if (!msg.copy) { if (!msg.ok && hoverJob === msg.jobId) showTip(msg.error || 'No log for this job'); break; }
        if (msg.ok && msg.text) {
          var okc = copyNow(msg.text); if (lb) flashLog(lb, okc); if (!okc) logPanel(msg.text);
        } else if (lb) { lb.title = msg.error || 'No log for this job'; lb.style.color = '#f24822'; setTimeout(function () { lb.style.color = ''; }, 2500); }
        break;
      }
      case 'history':
        renderHistory(msg.items || []);
        if (msg.showLatest && msg.items && msg.items.length && !running) showResult(msg.items[0]);
        break;
      case 'cancelled':
        running = false;
        updateGoBtn();
        stopTimer();
        el.timer.style.display = 'none';
        break;
      case 'error':
        running = false;
        updateGoBtn();
        stopTimer();
        el.timer.style.display = 'none';
        el.errMsg.textContent = msg.message;
        el.errCard.style.display = 'flex';
        if (stageState) {
          STAGES.forEach(function(n) { if (stageState[n] === 'active') stageState[n] = 'error'; });
          renderStages();
        }
        scroll();
        break;
      default:
        break;
    }
  };

  var MODE = { claude: 'Claude built', agent: 'v6 built, Figma Agent edits' };
  function when(t) {
    if (!t) return '';
    var d = new Date(t);
    return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }
  function pct(v) { return v != null ? v + '%' : '—'; }
  function fmtElapsedShort(ms) {
    if (ms == null) return '';
    var s = Math.max(0, Math.round(ms / 1000));
    var m = Math.floor(s / 60);
    s = s % 60;
    return 'Done in ' + (m ? m + 'm ' : '') + s + 's';
  }
  function fillResultText(d) {
    el.resName.textContent = d.name || 'Screen';
    var bits = [when(d.at || Date.now()), MODE[d.mode] || '', fmtElapsedShort(d.elapsedMs), d.request ? '“' + d.request + '”' : ''].filter(Boolean);
    el.resSub.textContent = bits.join(' · ');
  }
  function showResult(h) {
    doneNodeId = h.nodeId || null;
    fillResultText(h);
    var pass = h.pass !== false;
    el.resultCard.className = 'card result ' + (pass ? 'pass' : 'fail');
    el.matchScore.textContent = pct(h.match);
    el.matchScore.className = 'score ' + (pass ? 'pass' : 'fail');
    el.eyeScore.textContent = pct(h.eye);
    el.eyeScore.className = 'score ' + (pass ? 'pass' : 'fail');
    el.blocksList.style.display = h.blocks && h.blocks.length ? '' : 'none';
    el.blocksList.textContent = (h.blocks || []).join(' · ');
    el.resultCard.style.display = 'flex';
  }
  var logFull = {};
  function copyNow(text) {                           // must run inside the click (user gesture) — a copy after an async reply is blocked in the plugin iframe
    var ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); return ok;
  }
  function flashLog(b, ok) { b.title = ok ? 'Copied ✓' : 'Copy blocked — the log is open in a box'; b.style.color = ok ? '#1bc47d' : '#f24822'; setTimeout(function () { b.style.color = ''; b.title = 'Copy the log of this job'; }, 2000); }
  function logPanel(text) {                          // fallback: the whole log in a box, selected — press Cmd+C
    var old = document.getElementById('logPanel'); if (old) old.remove();
    var p = document.createElement('div'); p.id = 'logPanel'; p.style.cssText = 'position:fixed;inset:8px;z-index:100;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:8px;background:var(--figma-color-bg);border:1px solid var(--figma-color-border);box-shadow:0 6px 24px rgba(0,0,0,.35)';
    var t = document.createElement('textarea'); t.value = text; t.readOnly = true; t.style.cssText = 'flex:1;font:10px/1.4 ui-monospace,Menlo,monospace;resize:none';
    var r = document.createElement('div'); r.style.cssText = 'display:flex;gap:6px;align-items:center;font-size:11px';
    var m = document.createElement('span'); m.style.flex = '1'; m.textContent = 'Log selected — press Cmd+C (Ctrl+C), then close.';
    var c = document.createElement('button'); c.textContent = 'Close'; c.addEventListener('click', function () { p.remove(); });
    r.appendChild(m); r.appendChild(c); p.appendChild(t); p.appendChild(r); document.body.appendChild(p); t.focus(); t.select();
  }
  var hoverJob = null, logCache = {}, tipEl = null, tipPos = { x: 0, y: 0 };
  function tip() { if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'log-tip'; document.body.appendChild(tipEl); } return tipEl; }
  function positionTip(b) { var r = b.getBoundingClientRect(); tipPos = { x: Math.max(6, Math.min(r.right - 330, window.innerWidth - 336)), y: r.bottom + 6 }; }
  function showTip(text) { var t = tip(); t.textContent = text; t.style.left = tipPos.x + 'px'; t.style.top = tipPos.y + 'px'; t.style.display = 'block'; }
  function hideTip() { if (tipEl) tipEl.style.display = 'none'; }
  function logSummary(text) {
    var L = String(text).split('\n'), out = [];
    L.forEach(function (l) { if (/^\*\*(Request|Result|Total):/.test(l)) out.push(l.replace(/\*\*/g, '').slice(0, 150)); });
    var steps = L.filter(function (l) { return /#\d+ \*\*/.test(l); });
    out.push('', steps.length + ' steps · click = copy the full log', '');
    steps.slice(0, 9).forEach(function (l) { out.push(l.replace(/\*\*/g, '').trim().slice(0, 100)); });
    if (steps.length > 9) out.push('… +' + (steps.length - 9) + ' more');
    return out.join('\n');
  }
  function logButton(jobId) {
    var b = document.createElement('button'); b.className = 'log-btn'; b.title = 'Copy the log of this job (every step, timing and gate line)'; b.dataset.job = jobId || '';
    b.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 1.5h6l3 3v10h-9z"/><path d="M9.5 1.5v3h3M5.5 8h5M5.5 10.5h5M5.5 13h3"/></svg>';
    b.addEventListener('click', function (e) {
      e.stopPropagation(); if (!jobId) return;
      if (logFull[jobId]) { var ok = copyNow(logFull[jobId]); flashLog(b, ok); if (!ok) logPanel(logFull[jobId]); }
      else { b.title = 'Loading …'; postMsg({ type: 'open-log', jobId: jobId, copy: true }); }
    });
    b.addEventListener('mouseenter', function () {
      if (!jobId) return; hoverJob = jobId; positionTip(b);
      if (logCache[jobId]) showTip(logCache[jobId]); else { showTip('Loading the log …'); postMsg({ type: 'open-log', jobId: jobId, copy: false }); }
    });
    b.addEventListener('mouseleave', function () { hoverJob = null; hideTip(); });
    return b;
  }

  function renderHistory(items) {
    el.histCard.style.display = items.length ? 'flex' : 'none';
    el.histList.innerHTML = '';
    items.forEach(function (h) {
      var row = document.createElement('div');
      row.className = 'hist-item' + (h.pass === false ? ' fail' : '');
      var top = document.createElement('div'); top.className = 'hist-top';
      var name = document.createElement('span'); name.className = 'hist-name'; name.textContent = h.name || 'Screen';
      var score = document.createElement('span'); score.className = 'hist-score';
      score.textContent = 'MATCH ' + pct(h.match) + (h.eye != null ? ' · EYE ' + pct(h.eye) : '');
      top.appendChild(name); top.appendChild(score); top.appendChild(logButton(h.jobId));
      var sub = document.createElement('div'); sub.className = 'res-sub';
      sub.textContent = [when(h.at), MODE[h.mode] || '', fmtElapsedShort(h.elapsedMs), h.request ? '“' + h.request + '”' : ''].filter(Boolean).join(' · ');
      row.appendChild(top); row.appendChild(sub);
      row.title = 'Show in canvas';
      row.addEventListener('click', function () { showResult(h); if (h.nodeId) postMsg({ type: 'show-node', nodeId: h.nodeId }); });
      el.histList.appendChild(row);
    });
  }

  function postMsg(msg) {
    parent.postMessage({ pluginMessage: msg }, '*');
  }

  function scroll() {} // window now grows to fit content — nothing to scroll to

  // ── auto height: tell code.js the real content height, it resizes the window ──
  var lastSentHeight = 0;
  function sendHeight() {
    var h = document.body.scrollHeight;
    if (Math.abs(h - lastSentHeight) < 2) return;
    lastSentHeight = h;
    postMsg({ type: 'resize', height: h });
  }
  if (window.ResizeObserver) {
    new ResizeObserver(sendHeight).observe(document.body);
  } else {
    setInterval(sendHeight, 300);
  }

  // ── init ──────────────────────────────────────────────────────────────────
  postMsg({ type: 'reopen' });
  sendHeight();
})();
</script>
</body>
</html>
