<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAP Fiori → LLM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #fff;
      color: #1d2d3e;
    }

    header {
      background: #0070F2;
      color: #fff;
      padding: 12px 14px 10px;
    }
    header h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .3px;
    }
    header p {
      font-size: 11px;
      opacity: .85;
      margin-top: 2px;
    }

    #info {
      padding: 10px 14px 6px;
      border-bottom: 1px solid #e5e5e5;
      min-height: 48px;
    }
    #component-name {
      font-weight: 600;
      font-size: 13px;
      color: #1d2d3e;
    }
    .badge {
      display: inline-block;
      margin-top: 4px;
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      background: #e5f2ff;
      color: #0070F2;
    }
    .badge.available { background: #e8f5e9; color: #107E3E; }
    .badge.deprecated { background: #fff3e0; color: #e8a000; }
    .badge.experimental { background: #f3e5f5; color: #9c27b0; }
    #category { font-size: 11px; color: #6c757d; margin-top: 3px; }

    #actions {
      padding: 10px 14px;
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: filter .15s;
    }
    button:hover { filter: brightness(.92); }
    button:active { filter: brightness(.85); }

    #btn-copy {
      background: #0070F2;
      color: #fff;
    }
    #btn-download {
      background: #f5f6f7;
      color: #1d2d3e;
      border: 1px solid #d9d9d9;
    }

    #status {
      padding: 6px 14px 4px;
      font-size: 11px;
      color: #6c757d;
      min-height: 22px;
    }
    #status.ok   { color: #107E3E; }
    #status.err  { color: #BB0000; }

    details {
      border-top: 1px solid #e5e5e5;
    }
    summary {
      padding: 8px 14px;
      font-size: 11px;
      color: #6c757d;
      cursor: pointer;
      user-select: none;
      list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: '▸ '; }
    details[open] summary::before { content: '▾ '; }

    .tip {
      padding: 0 14px 10px;
      font-size: 11px;
      line-height: 1.5;
      color: #444;
    }
    .tip code {
      background: #f5f6f7;
      border-radius: 3px;
      padding: 1px 4px;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      color: #0070F2;
    }
  </style>
</head>
<body>
  <header>
    <h1>SAP Fiori → LLM</h1>
    <p>Extract guideline for Claude or any LLM</p>
  </header>

  <div id="info">
    <div id="component-name">Loading…</div>
    <span id="status-badge" class="badge"></span>
    <div id="category"></div>
  </div>

  <div id="actions">
    <button id="btn-copy">📋 Copy for Claude</button>
    <button id="btn-download">⬇ Download .md</button>
  </div>

  <div id="status"></div>

  <details>
    <summary>Bulk export (400+ pages)</summary>
    <div class="tip">
      Append <code>?bulk_export=true</code> to any SAP guideline URL.<br>
      The extension auto-downloads the <code>.md</code> and closes the tab.<br><br>
      Use a <em>Bulk URL Opener</em> extension to open all pages at once — each is
      processed automatically.
    </div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
